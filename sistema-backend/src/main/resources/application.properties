spring.application.name=Proyecto

# PUERTO DEL SERVIDOR
server.port=${DB_PORT:8000}

# CONFIGURACION POSTGRESQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# DRIVER POSTGRESQL
spring.datasource.driver-class-name=org.postgresql.Driver

# CONFIGURACION JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update

# Mostrar consultas SQL en consola
spring.jpa.show-sql=true

# Formatear SQL en consola
spring.jpa.properties.hibernate.format_sql=true

# Dialecto PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CONFIGURACION LOMBOK (opcional)
spring.main.allow-circular-references=true

# JWT
jwt.secret=${CLAVEJWT}

# MERCADO PAGO
mercadopago.access-token=${MERCADO_PAGO_ACCES_TOKEN}